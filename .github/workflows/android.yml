name: Build Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:android
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 et KEYSTORE_PASSWORD manquants (voir README, section Android)"; exit 1
          fi
          brut=$(printf '%s' "$KEYSTORE_BASE64" | wc -c)
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' > "$RUNNER_TEMP/ks.b64"
          n=$(wc -c < "$RUNNER_TEMP/ks.b64")
          echo "Secret KEYSTORE_BASE64 : $brut caractères reçus, $n après nettoyage (attendu 3532)"
          if ! base64 -d "$RUNNER_TEMP/ks.b64" > android/app/carnet.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 n'est pas décodable ($brut reçus, $n après nettoyage, attendu 3532) : contenu tronqué ou incomplet."; exit 1
          fi
          if ! keytool -list -keystore android/app/carnet.keystore -storepass "$KEYSTORE_PASSWORD" -alias carnet > "$RUNNER_TEMP/kt.out" 2>&1; then
            echo "::error::Clé décodée ($brut reçus, $n après nettoyage, attendu 3532) mais illisible ou mot de passe incorrect : $(head -c 150 "$RUNNER_TEMP/kt.out")"; exit 1
          fi
          echo "Clé de signature valide (alias carnet)"
      - name: Assemble release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"
      - name: Résumé de l'échec Gradle
        if: failure()
        run: |
          f="$RUNNER_TEMP/gradle.log"
          [ -f "$f" ] || exit 0
          awk '/What went wrong/{p=1;c=0} p&&c<8{print;c++}' "$f" | tr '\n' ' ' | cut -c1-700 | sed 's/^/::error::/'
          echo
          grep -nE "^e: |error:|Caused by|FAILED|Could not" "$f" | head -6 | cut -c1-300 | sed 's/^/::error::/'
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk carnet-recettes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: carnet-recettes-apk
          path: carnet-recettes.apk
          retention-days: 14
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: carnet-recettes.apk
          body: |
            APK Android (hors-ligne). Téléchargez `carnet-recettes.apk` sur le téléphone puis installez-le (autoriser les sources inconnues pour le navigateur si demandé).
